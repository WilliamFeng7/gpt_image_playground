name: Build macOS (Apple Silicon)

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      base:
        required: true
        type: string
      upstream:
        required: true
        type: string
      tree:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.base || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reproduce the upstream merge
        if: inputs.upstream != ''
        env:
          UPSTREAM: ${{ inputs.upstream }}
          TREE: ${{ inputs.tree }}
        run: |
          git fetch --no-tags https://github.com/CookSleep/gpt_image_playground.git "$UPSTREAM"
          git -c user.name=ci -c user.email=ci@users.noreply.github.com merge --no-ff --no-commit "$UPSTREAM"
          test "$(git write-tree)" = "$TREE"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Build and verify the ARM64 app
        env:
          APPLE_SIGNING_IDENTITY: '-'
          BUNDLES: ${{ inputs.upstream != '' && 'app' || 'app,dmg' }}
        run: |
          rustup target add aarch64-apple-darwin
          npm ci
          npm run tauri:build -- --target aarch64-apple-darwin --bundles "$BUNDLES" -- --locked
          MACOSX_DEPLOYMENT_TARGET=14.0 cargo test --locked --release --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin --features tauri/custom-protocol
          app=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          lipo "$app/Contents/MacOS/gpt-image-playground" -verify_arch arm64
          lipo "$app/Contents/MacOS/gpt-image-playground-cli" -verify_arch arm64
          codesign --verify --deep --strict "$app"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: inputs.upstream == ''
        with:
          name: GPT-Image-Playground-macOS-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          compression-level: 0
